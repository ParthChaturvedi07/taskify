<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tunnel Grid</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
    width: 100%;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="tunnel"></canvas>
<script>
const canvas = document.getElementById('tunnel');
const ctx = canvas.getContext('2d');

let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Tunnel geometry: a rectangular tube receding to a vanishing point,
// with the "camera" moving forward through it (creating the animation).

let camZ = 0; // camera moves forward through the tunnel over time
const SPEED = 2.5;

// Project a 3D point (x, y, z relative to camera) to 2D screen space
function project(x, y, z) {
  const fov = 600; // focal length -- controls perspective strength
  const scale = fov / (fov + z);
  return {
    x: cx + x * scale,
    y: cy + y * scale,
    scale: scale
  };
}

function drawTunnel(time) {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);

  const tunnelHalfW = W * 0.62;
  const tunnelHalfH = H * 0.62;

  camZ += SPEED;
  if (camZ > 100000) camZ -= 100000;

  // ----- Glow at vanishing point -----
  const glowZ = 900; // distance of the light source ahead
  const glowProj = project(0, 0, glowZ);
  const pulsatingScale = 1 + Math.sin(time * 0.002) * 0.05;

  const gradRadius = 1000 * glowProj.scale * pulsatingScale;
  const grad = ctx.createRadialGradient(
    glowProj.x, glowProj.y, 0,
    glowProj.x, glowProj.y, gradRadius
  );
  grad.addColorStop(0,    'rgba(255,255,255,1)');
  grad.addColorStop(0.08, 'rgba(240,245,255,1)');
  grad.addColorStop(0.20, 'rgba(180,210,255,0.95)');
  grad.addColorStop(0.40, 'rgba(100,140,255,0.75)');
  grad.addColorStop(0.65, 'rgba(40,70,220,0.45)');
  grad.addColorStop(0.85, 'rgba(15,25,120,0.18)');
  grad.addColorStop(1,    'rgba(5,5,30,0)');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(glowProj.x, glowProj.y, gradRadius, 0, Math.PI * 2);
  ctx.fill();

  // Tunnel is drawn as 4 walls (left, right, top, bottom), each with a grid of
  // lines running along Z (longitudinal) and rings across (transversal, animated).

  function wallPoint(u, v, z, wall) {
    // u,v in [-1,1] describe position across the wall's two axes
    if (wall === 'top' || wall === 'bottom') {
      const y = wall === 'top' ? -tunnelHalfH : tunnelHalfH;
      const x = u * tunnelHalfW;
      return project(x, y, z);
    } else {
      const x = wall === 'left' ? -tunnelHalfW : tunnelHalfW;
      const y = v * tunnelHalfH;
      return project(x, y, z);
    }
  }

  const walls = ['top', 'bottom', 'left', 'right'];
  const zNear = -150;
  const zFar = 3200;
  const ringCount = 44;
  const ringSpacing = 90;

  // Longitudinal lines on each wall
  ctx.strokeStyle = 'rgba(150,180,255,0.5)';
  for (const wall of walls) {
    const divisions = 12;
    for (let i = 0; i <= divisions; i++) {
      const u = (i / divisions) * 2 - 1;
      ctx.beginPath();
      let started = false;
      for (let d = 0; d <= 60; d++) {
        const z = zNear + d * 60;
        const p = wallPoint(u, u, z, wall);
        if (p.scale <= 0.02) continue;
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }
  }

  // Transversal rings (the lines that move toward viewer, creating motion)
  ctx.strokeStyle = 'rgba(160,190,255,0.6)';
  const offset = camZ % ringSpacing;
  for (let r = -1; r <= ringCount; r++) {
    const z = zNear + r * ringSpacing - offset;
    if (z < zNear - ringSpacing) continue;
    if (z > zFar) continue;

    const fadeNear = Math.min(1, Math.max(0, (z - zNear) / 200));
    const alpha = 0.55 * fadeNear;
    ctx.strokeStyle = `rgba(150,180,255,${alpha})`;

    ctx.beginPath();
    const divisions = 40;
    let started = false;
    // top edge
    for (let i = 0; i <= divisions; i++) {
      const u = (i / divisions) * 2 - 1;
      const p = wallPoint(u, u, z, 'top');
      if (p.scale <= 0.02) continue;
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    ctx.beginPath();
    started = false;
    for (let i = 0; i <= divisions; i++) {
      const u = (i / divisions) * 2 - 1;
      const p = wallPoint(u, u, z, 'bottom');
      if (p.scale <= 0.02) continue;
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    ctx.beginPath();
    started = false;
    for (let i = 0; i <= divisions; i++) {
      const v = (i / divisions) * 2 - 1;
      const p = wallPoint(v, v, z, 'left');
      if (p.scale <= 0.02) continue;
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    ctx.beginPath();
    started = false;
    for (let i = 0; i <= divisions; i++) {
      const v = (i / divisions) * 2 - 1;
      const p = wallPoint(v, v, z, 'right');
      if (p.scale <= 0.02) continue;
      if (!started) { ctx.moveTo(p.x, p.y); started = true; }
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }

  requestAnimationFrame(drawTunnel);
}

requestAnimationFrame(drawTunnel);
</script>
</body>
</html>
